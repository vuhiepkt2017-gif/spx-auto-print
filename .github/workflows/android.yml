name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép kích hoạt chạy build thủ công từ giao diện web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Thiết lập Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.4.1

    - name: Tạo file google-services.json giả lập để qua kiểm tra CI
      run: |
        echo '{"project_info":{"project_number":"123456789","project_id":"dummy-id","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456","android_client_info":{"package_name":"com.VTDStadio.Hotroin"}},"oauth_client":[],"api_key":[{"current_key":"dummy-key"}]}]}' > app/google-services.json

    - name: Build ứng dụng (Tạo APK Debug)
      run: gradle assembleDebug
      working-directory: .

    - name: Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shopee-auto-print-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
