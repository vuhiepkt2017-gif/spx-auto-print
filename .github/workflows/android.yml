name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép kích hoạt chạy build thủ công từ giao diện web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Thiết lập Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build ứng dụng (Tạo APK Debug)
      run: ./gradlew assembleDebug
      working-directory: .

    - name: Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shopee-auto-print-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
